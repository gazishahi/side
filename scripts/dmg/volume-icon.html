<!doctype html>
<!-- The mounted DMG's icon (desktop, Finder's sidebar, the window's title bar). macOS's own
     disk-image volume shape, an upright drive with a status light on its bottom cap, drawn
     here in Side's graphite with Side's mark where the system's arrow goes. Rendered at
     1024 x 1024 by scripts/dmg/build-assets.sh, which makes VolumeIcon.icns from it. -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; background: transparent; overflow: hidden; }
  .drive { position: absolute; inset: 0; filter: drop-shadow(0 30px 22px rgba(0, 0, 0, 0.30)) drop-shadow(0 8px 8px rgba(0, 0, 0, 0.18)); }
  svg.shape { position: absolute; left: 0; top: 0; }
  .mark {
    position: absolute; left: 362px; top: 296px; width: 300px; height: 300px;
    color: #d9dde3;
    /* Set into the surface, as the system's arrow is: shadow above, light below. */
    filter: drop-shadow(0 -3px 0 rgba(0, 0, 0, 0.5)) drop-shadow(0 3px 0 rgba(255, 255, 255, 0.12));
  }
  /* The drive's base, seen from the front: one flat face of the same object, with a fine
     highlight where its top edge turns toward the light. */
  .cap {
    position: absolute; left: 150px; top: 832px; width: 724px; height: 112px;
    border-radius: 56px;
    /* A shade below the body, as Apple's base is, so it reads as its own face of one object. */
    background: linear-gradient(180deg, #24272c 0%, #1b1d21 60%, #16181b 100%);
    box-shadow:
      inset 0 2.5px 0 rgba(255, 255, 255, 0.30),
      inset 0 0 0 1.5px rgba(0, 0, 0, 0.45);
  }
  .light {
    position: absolute; right: 54px; top: 44px; width: 24px; height: 24px; border-radius: 50%;
    background: #8fb0ff;
    box-shadow: 0 0 18px 5px rgba(76, 123, 240, 0.7), inset 0 -3px 4px rgba(0, 0, 0, 0.2);
  }
</style>
</head>
<body>
  <div class="drive">
  <svg class="shape" width="1024" height="1024" viewBox="0 0 1024 1024">
    <defs>
      <!-- Rounded sides: a dark edge, a bright rim just inside it, then the flat front. -->
      <linearGradient id="sides" x1="150" y1="0" x2="874" y2="0" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#000" stop-opacity="0.45"/>
        <stop offset="0.018" stop-color="#fff" stop-opacity="0.16"/>
        <stop offset="0.06" stop-color="#fff" stop-opacity="0.04"/>
        <stop offset="0.5" stop-color="#fff" stop-opacity="0.015"/>
        <stop offset="0.94" stop-color="#fff" stop-opacity="0.035"/>
        <stop offset="0.982" stop-color="#fff" stop-opacity="0.13"/>
        <stop offset="1" stop-color="#000" stop-opacity="0.48"/>
      </linearGradient>
      <linearGradient id="face" x1="0" y1="74" x2="0" y2="888" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#454a52"/>
        <stop offset="0.07" stop-color="#363a41"/>
        <stop offset="0.45" stop-color="#2c3036"/>
        <stop offset="1" stop-color="#212429"/>
      </linearGradient>
      <!-- The top edge turning away: light at the top, gone within the corner's height. -->
      <linearGradient id="topLight" x1="0" y1="74" x2="0" y2="140" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#fff" stop-opacity="0.16"/>
        <stop offset="1" stop-color="#fff" stop-opacity="0"/>
      </linearGradient>
      <!-- The fine highlight along the top edge, fading as it runs down the corners. -->
      <linearGradient id="rim" x1="0" y1="74" x2="0" y2="130" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#fff" stop-opacity="0.85"/>
        <stop offset="0.6" stop-color="#fff" stop-opacity="0.25"/>
        <stop offset="1" stop-color="#fff" stop-opacity="0"/>
      </linearGradient>
      <!-- Just under the lip, a hair of shadow where the edge turns. -->
      <linearGradient id="underRim" x1="0" y1="74" x2="0" y2="130" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#000" stop-opacity="0.14"/>
        <stop offset="1" stop-color="#000" stop-opacity="0"/>
      </linearGradient>
      <clipPath id="bodyClip"><path d="M 224 74 H 800 C 863.64 74 874 81.84 874 130 V 888 H 150 V 130 C 150 81.84 160.36 74 224 74 Z"/></clipPath>
    </defs>
    <path d="M 224 74 H 800 C 863.64 74 874 81.84 874 130 V 888 H 150 V 130 C 150 81.84 160.36 74 224 74 Z" fill="url(#face)"/>
    <path d="M 224 74 H 800 C 863.64 74 874 81.84 874 130 V 888 H 150 V 130 C 150 81.84 160.36 74 224 74 Z" fill="url(#sides)"/>
    <rect x="150" y="74" width="724" height="66" fill="url(#topLight)" clip-path="url(#bodyClip)"/>
    <path d="M 224 74 H 800 C 863.64 74 874 81.84 874 130 V 888 H 150 V 130 C 150 81.84 160.36 74 224 74 Z" fill="none" stroke="url(#underRim)" stroke-width="7" clip-path="url(#bodyClip)" transform="translate(0 3)"/>
    <path d="M 224 74 H 800 C 863.64 74 874 81.84 874 130 V 888 H 150 V 130 C 150 81.84 160.36 74 224 74 Z" fill="none" stroke="url(#rim)" stroke-width="4" clip-path="url(#bodyClip)"/>
  </svg>
  <svg class="mark" viewBox="160 160 704 704" fill="currentColor">
    <path d="M256 192H736.804041A16 16 0 0 1 748.117749 219.313708L219.313708 748.117749A16 16 0 0 1 192 736.804041V256A64 64 0 0 1 256 192Z"/>
    <path d="M256 192H736.804041A16 16 0 0 1 748.117749 219.313708L219.313708 748.117749A16 16 0 0 1 192 736.804041V256A64 64 0 0 1 256 192Z" transform="rotate(180 512 512)"/>
  </svg>
  <div class="cap"><div class="light"></div></div>
  </div>
</body>
</html>
