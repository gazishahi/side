<!doctype html>
<!-- The mounted DMG's icon on the desktop: a drive with Side's mark. Rendered at 1024 x 1024 by
     scripts/dmg/build-background.sh, which makes VolumeIcon.icns from it. -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; background: transparent; overflow: hidden; }
  .drive {
    position: absolute; left: 112px; top: 300px; width: 800px; height: 440px;
    border-radius: 96px;
    background: linear-gradient(180deg, #3a3f47 0%, #24282e 42%, #17191d 100%);
    box-shadow:
      0 0 0 2px rgba(255, 255, 255, 0.07),
      inset 0 3px 0 rgba(255, 255, 255, 0.22),
      inset 0 -6px 14px rgba(0, 0, 0, 0.45),
      0 34px 60px rgba(0, 0, 0, 0.42),
      0 10px 18px rgba(0, 0, 0, 0.28);
  }
  /* The top face, catching the light. */
  .drive::before {
    content: ""; position: absolute; left: 22px; right: 22px; top: 16px; height: 150px;
    border-radius: 80px 80px 40px 40px;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0));
  }
  .mark { position: absolute; left: 92px; top: 132px; width: 176px; height: 176px; color: #eef0f4;
          filter: drop-shadow(0 2px 0 rgba(0, 0, 0, 0.35)); }
  .label { position: absolute; left: 300px; top: 168px; font: 600 92px -apple-system, "SF Pro Display", sans-serif;
           letter-spacing: -2px; color: #eef0f4; text-shadow: 0 2px 0 rgba(0, 0, 0, 0.35); }
  .seam { position: absolute; left: 60px; right: 60px; bottom: 74px; height: 3px; border-radius: 2px;
          background: rgba(0, 0, 0, 0.45); box-shadow: 0 2px 0 rgba(255, 255, 255, 0.06); }
  .light { position: absolute; right: 86px; bottom: 112px; width: 26px; height: 26px; border-radius: 50%;
           background: #7da3ff; box-shadow: 0 0 22px 6px rgba(76, 123, 240, 0.75), inset 0 -3px 4px rgba(0, 0, 0, 0.25); }
</style>
</head>
<body>
  <div class="drive">
    <svg class="mark" viewBox="160 160 704 704" fill="currentColor">
      <path d="M256 192H736.804041A16 16 0 0 1 748.117749 219.313708L219.313708 748.117749A16 16 0 0 1 192 736.804041V256A64 64 0 0 1 256 192Z"/>
      <path d="M256 192H736.804041A16 16 0 0 1 748.117749 219.313708L219.313708 748.117749A16 16 0 0 1 192 736.804041V256A64 64 0 0 1 256 192Z" transform="rotate(180 512 512)"/>
    </svg>
    <div class="label">Side</div>
    <div class="seam"></div>
    <div class="light"></div>
  </div>
</body>
</html>
