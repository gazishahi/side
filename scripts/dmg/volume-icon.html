<!doctype html>
<!-- The mounted DMG's icon (desktop, Finder's sidebar, the window's title bar). macOS's own
     disk-image volume shape, an upright drive with a status light on its bottom cap, drawn
     here in Side's graphite with Side's mark where the system's arrow goes. Rendered at
     1024 x 1024 by scripts/dmg/build-assets.sh, which makes VolumeIcon.icns from it. -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; background: transparent; overflow: hidden; }
  .body {
    position: absolute; left: 150px; top: 74px; width: 724px; height: 800px;
    border-radius: 58px 58px 18px 18px / 46px 46px 18px 18px;
    /* Rounded sides: a bright rim just inside each edge, falling off toward the middle. */
    background:
      linear-gradient(90deg, rgba(0, 0, 0, 0.42) 0%, rgba(255, 255, 255, 0.16) 2.5%, rgba(255, 255, 255, 0.05) 8%,
                      rgba(255, 255, 255, 0.02) 50%, rgba(255, 255, 255, 0.04) 92%, rgba(255, 255, 255, 0.13) 97.5%, rgba(0, 0, 0, 0.45) 100%),
      linear-gradient(180deg, #41464e 0%, #2c3036 45%, #212429 100%);
    box-shadow:
      inset 0 4px 0 rgba(255, 255, 255, 0.20),
      inset 0 0 0 2px rgba(255, 255, 255, 0.05),
      0 30px 50px rgba(0, 0, 0, 0.35),
      0 8px 14px rgba(0, 0, 0, 0.22);
  }
  /* The rounded top edge, catching the light. */
  .body::before {
    content: ""; position: absolute; left: 10px; right: 10px; top: 6px; height: 46px;
    border-radius: 40px 40px 8px 8px;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0));
  }
  .mark {
    position: absolute; left: 362px; top: 296px; width: 300px; height: 300px;
    color: #d9dde3;
    /* Set into the surface, as the system's arrow is: shadow above, light below. */
    filter: drop-shadow(0 -3px 0 rgba(0, 0, 0, 0.5)) drop-shadow(0 3px 0 rgba(255, 255, 255, 0.12));
  }
  .cap {
    position: absolute; left: 150px; top: 832px; width: 724px; height: 112px;
    border-radius: 56px;
    /* A cylinder: lit along its upper middle, dark at the rounded ends. */
    background:
      linear-gradient(90deg, rgba(0, 0, 0, 0.45) 0%, rgba(0, 0, 0, 0) 9%, rgba(0, 0, 0, 0) 91%, rgba(0, 0, 0, 0.5) 100%),
      linear-gradient(180deg, #4a4f57 0%, #2b2f35 38%, #1a1c20 72%, #111315 100%);
    box-shadow:
      inset 0 3px 0 rgba(255, 255, 255, 0.16),
      inset 0 -4px 8px rgba(0, 0, 0, 0.5),
      0 0 0 2px rgba(255, 255, 255, 0.05),
      0 18px 30px rgba(0, 0, 0, 0.35);
  }
  .light {
    position: absolute; right: 54px; top: 44px; width: 24px; height: 24px; border-radius: 50%;
    background: #8fb0ff;
    box-shadow: 0 0 18px 5px rgba(76, 123, 240, 0.7), inset 0 -3px 4px rgba(0, 0, 0, 0.2);
  }
</style>
</head>
<body>
  <div class="body"></div>
  <svg class="mark" viewBox="160 160 704 704" fill="currentColor">
    <path d="M256 192H736.804041A16 16 0 0 1 748.117749 219.313708L219.313708 748.117749A16 16 0 0 1 192 736.804041V256A64 64 0 0 1 256 192Z"/>
    <path d="M256 192H736.804041A16 16 0 0 1 748.117749 219.313708L219.313708 748.117749A16 16 0 0 1 192 736.804041V256A64 64 0 0 1 256 192Z" transform="rotate(180 512 512)"/>
  </svg>
  <div class="cap"><div class="light"></div></div>
</body>
</html>
