<!doctype html>
<!--
  The DMG window's background (scripts/dmg/build-background.sh renders it at 1x and 2x).
  640 x 400 points: the window's content area. Side.app sits at (170, 190) and Applications at
  (470, 190), 112 point icons (scripts/dmg/settings.py). Finder draws each icon's label itself,
  black in light mode and white in dark, and the background can't follow the mode; so each label
  sits on a mid-tone pill where both read.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "DM Sans"; src: url("fonts/dm-sans-latin.woff2") format("woff2"); font-weight: 100 1000; }
  @font-face { font-family: "JetBrains Mono"; src: url("fonts/jetbrains-mono-latin.woff2") format("woff2"); font-weight: 100 800; }
  html, body { margin: 0; width: 640px; height: 400px; overflow: hidden; }
  body {
    position: relative;
    background:
      radial-gradient(420px 220px at 320px 178px, rgba(76, 123, 240, 0.16), transparent 70%),
      radial-gradient(900px 500px at 320px -40px, #1d2026, transparent 70%),
      #121417;
    font-family: "DM Sans", sans-serif;
  }
  /* A faint dot grid, like the editor's canvas. */
  .grid {
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255, 255, 255, 0.055) 1px, transparent 1.2px);
    background-size: 20px 20px;
    background-position: 10px 10px;
    -webkit-mask-image: radial-gradient(520px 320px at 320px 190px, #000 30%, transparent 80%);
  }
  .brand { position: absolute; left: 26px; top: 22px; display: flex; align-items: center; gap: 9px; color: #e9eaee; }
  .brand span { font-size: 15px; font-weight: 600; letter-spacing: -0.2px; }
  .brand svg { width: 17px; height: 17px; }
  .version { position: absolute; right: 26px; top: 25px; font: 500 10.5px "JetBrains Mono", monospace; color: #6c727d; letter-spacing: 0.4px; }
  /* Under each icon: where Finder draws its label. */
  .plate {
    position: absolute; top: 251px; height: 25px; width: 128px; margin-left: -64px;
    border-radius: 12.5px;
    /* Mid-tone: black text 5:1 on it, white 4:1. */
    background: linear-gradient(#858b96, #777d88);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16), inset 0 0 0 1px rgba(255, 255, 255, 0.06), 0 8px 22px rgba(0, 0, 0, 0.4);
  }
  .hint {
    position: absolute; left: 0; right: 0; top: 304px; text-align: center;
    font: 500 11px "JetBrains Mono", monospace; color: #8b919b; letter-spacing: 0.3px;
  }
  .hint b { color: #c9d3ff; font-weight: 500; }
  .tagline {
    position: absolute; left: 0; right: 0; bottom: 22px; text-align: center;
    font-size: 12.5px; color: #5d636d; letter-spacing: 0.1px;
  }
  svg.track { position: absolute; left: 0; top: 0; }
</style>
</head>
<body>
  <div class="grid"></div>

  <div class="brand">
    <svg viewBox="160 160 704 704" fill="currentColor" aria-hidden="true">
      <path d="M256 192H736.804041A16 16 0 0 1 748.117749 219.313708L219.313708 748.117749A16 16 0 0 1 192 736.804041V256A64 64 0 0 1 256 192Z"/>
      <path d="M256 192H736.804041A16 16 0 0 1 748.117749 219.313708L219.313708 748.117749A16 16 0 0 1 192 736.804041V256A64 64 0 0 1 256 192Z" transform="rotate(180 512 512)"/>
    </svg>
    <span>Side</span>
  </div>
  <div class="version" id="version">0.1</div>

  <!-- The track: it leaves Side, makes its checkpoints, and lands in Applications, the way a
       track is promoted into main. -->
  <svg class="track" width="640" height="400" viewBox="0 0 640 400">
    <defs>
      <linearGradient id="ink" x1="236" y1="0" x2="404" y2="0" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#4c7bf0" stop-opacity="0.35"/>
        <stop offset="0.45" stop-color="#6f97ff"/>
        <stop offset="1" stop-color="#a9c0ff"/>
      </linearGradient>
      <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
        <feGaussianBlur stdDeviation="3.2" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <!-- main: a quiet baseline the track rejoins -->
    <line x1="236" y1="190" x2="404" y2="190" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1.5" stroke-dasharray="2 5"/>
    <g filter="url(#glow)" fill="none" stroke="url(#ink)" stroke-width="2" stroke-linecap="round">
      <path d="M236 190 C 262 190, 266 146, 296 146 L 344 146 C 374 146, 378 190, 394 190"/>
    </g>
    <!-- checkpoints -->
    <g fill="#121417" stroke="#8fb0ff" stroke-width="1.8">
      <circle cx="304" cy="146" r="4.2"/>
      <circle cx="336" cy="146" r="4.2"/>
    </g>
    <!-- landed: the track rejoins the baseline, the way a promoted track lands on main -->
    <circle cx="398" cy="190" r="9" fill="#4c7bf0" fill-opacity="0.18"/>
    <circle cx="398" cy="190" r="4.6" fill="#a9c0ff" filter="url(#glow)"/>
  </svg>

  <div class="plate" style="left:170px"></div>
  <div class="plate" style="left:470px"></div>

  <div class="hint">Drag <b>Side</b> to Applications</div>
  <div class="tagline">A little more focus.</div>
  <script>
    const v = new URLSearchParams(location.search).get("version");
    if (v) document.getElementById("version").textContent = v;
  </script>
</body>
</html>
